    <script>
      try {
        var t = localStorage.getItem("kilowhy-theme");
        document.documentElement.classList.toggle(
          "dark",
          t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
